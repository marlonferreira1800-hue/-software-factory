databases:
  - name: fabrica-livre-db
    databaseName: fabrica_livre
    user: fabrica
    plan: free

services:
  - type: web
    name: fabrica-livre-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:shared && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build:api
    startCommand: NODE_ENV=production npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && NODE_ENV=production npx tsx apps/api/prisma/seed.ts && NODE_ENV=production node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fabrica-livre-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: fabrica-livre-web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build:shared && NODE_OPTIONS="--max-old-space-size=460" npm run build:web
    startCommand: NODE_ENV=production npm run start --workspace=apps/web
    healthCheckPath: /
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: fabrica-livre-api
          property: host
